name: W3C HTML Validation

on:
  push:
  pull_request:

jobs:
  validate-html:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate HTML with W3C Validator
        uses: Cyb3r-Jak3/html5validator-action@v7.2.0
        with:
          root: .
