<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Todo App</title>

    <link rel="stylesheet" href="styles/variable.css" />
    <link rel="stylesheet" href="styles/style.css" />

    <script type="module" src="scripts/script.js"></script>
  </head>
  <body>
    <section class="todo-container">
      <div class="todo-input-container">
        <input
          class="todo-input-field"
          type="text"
          placeholder="Add a new todo"
        />
        <button class="todo-input-button">Add</button>
      </div>

      <div class="todo-switch-container">
        <label for="todo-switch" class="todo-switch-item">
          <input type="checkbox" id="todo-switch" />
          <span class="todo-switch-slider"></span>
        </label>
      </div>

      <div class="todo-table-container">
        <table class="todo-table">
          <thead>
            <tr>
              <th>S/N</th>
              <th>Task</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>1</td>
              <td>Todo 1</td>
              <td>
                <div class="todo-actions">
                  <button
                    type="button"
                    class="todo-actions-toggle"
                    aria-haspopup="true"
                    aria-expanded="false"
                  >
                    &#x22EE;
                  </button>
                  <div class="todo-actions-menu" role="menu">
                    <button
                      type="button"
                      class="todo-actions-item"
                      data-action="edit"
                    >
                      Edit
                    </button>
                    <button
                      type="button"
                      class="todo-actions-item"
                      data-action="delete"
                    >
                      Mark as Completed
                    </button>
                    <button
                      type="button"
                      class="todo-actions-item"
                      data-action="delete"
                    >
                      Delete
                    </button>
                  </div>
                </div>
              </td>
            </tr>
            <tr>
              <td>1</td>
              <td>Todo 1</td>
              <td>
                <div class="todo-actions">
                  <button
                    type="button"
                    class="todo-actions-toggle"
                    aria-haspopup="true"
                    aria-expanded="false"
                  >
                    &#x22EE;
                  </button>
                  <div class="todo-actions-menu" role="menu">
                    <button
                      type="button"
                      class="todo-actions-item"
                      data-action="edit"
                    >
                      Edit
                    </button>
                    <button
                      type="button"
                      class="todo-actions-item"
                      data-action="delete"
                    >
                      Delete
                    </button>
                  </div>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </body>
</html>
